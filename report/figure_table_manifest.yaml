report:
  language: zh-CN
  format: LaTeX PDF
  output: output/pdf/pai_industrial_world_model_report.pdf
  rule: 现有 CSV/JSON 是报告定量结果的唯一数据来源。

figures:
  - id: fig1_framework
    title: 项目整体技术路线
    decision: figure
    archetype: schematic-led composite
    question: 历史工业轨迹如何连接世界模型训练、策略优化和仿真验证？
    controls: 只表达技术流程，不放置模型选择协议和结果数字。
    conclusion: 冻结的世界模型分别支持规划与基于模型的强化学习，最终在 NeoRL 仿真环境中验证。
    exports: [pdf, svg, png]

  - id: fig2_world_model_heatmaps
    title: 模型架构与数据规模
    decision: figure
    archetype: quantitative grid
    question: 模型架构和数据规模如何共同影响单步与多步预测？
    sources: [outputs/metrics/world_model_5x3_common_validation_models.csv]
    controls: 使用同一统一验证口径；同一数据规模内只改变模型架构。
    conclusion: 单步排序与多步排序不完全相同，最合适模型随数据规模变化。
    exports: [pdf, svg, png]

  - id: fig3_multistep_error
    title: 多步递归预测误差累积
    decision: figure
    archetype: quantitative grid
    question: 为什么单步准确率不足以评价递归使用的世界模型？
    sources: [outputs/metrics/world_model_5x3_common_validation_models.csv]
    controls: 固定 M1000，在1、5、10、20、50步递归预测条件下统一评价。
    conclusion: 单步误差相近的模型在长递归预测中可明显分离。
    exports: [pdf, svg, png]

  - id: fig4_representative_rollout
    title: 代表性50步递归预测轨迹
    decision: figure
    archetype: quantitative grid
    question: 关键工业变量的递归预测偏差如何随时间演化？
    sources: [report/generated/representative_h50_rollout.csv]
    controls: 仅使用现有离线推理结果；动作来自记录轨迹；选择误差接近中位数的轨迹。
    conclusion: 不同物理变量呈现不同的误差累积方式。
    exports: [pdf, svg, png]

  - id: fig5_strategy_matrix
    title: 不同数据规模下的策略控制效果
    decision: figure
    archetype: quantitative grid
    question: 每个数据规模固定世界模型后，哪种策略取得更高累计奖励？
    sources: [outputs/metrics/main_system_matrix_development_episodes.csv]
    controls: 固定各规模世界模型、1000步回合与奖励定义；每种组合5次独立仿真。
    conclusion: M100 中 CEM 最高，M1000 与 M10000 中 MPPI 最高；M100 的 iCEM 异常值在轴外标注。
    exports: [pdf, svg, png]

  - id: fig6_cross_ablation
    title: 世界模型与后续策略控制变量消融
    decision: figure
    archetype: quantitative grid
    question: 统一预测评价排序是否完全决定后续控制排序？
    sources: [outputs/metrics/world_model_control_cross_m1000_episodes.csv]
    controls: 固定 M1000；各面板内固定策略设置，只改变世界模型。
    conclusion: MPPI 与 MB-PPO 对不同世界模型呈现不同的控制排序。
    exports: [pdf, svg, png]

  - id: fig7_final_simulator
    title: 最终 NeoRL 长期控制结果
    decision: figure
    archetype: quantitative grid
    question: 选定系统能否提高1000步累计奖励？
    sources:
      - outputs/metrics/strategy_ib_m1000.json
      - outputs/metrics/final_selected_systems_fresh_seeds_episodes.csv
    controls: 仿真方法使用10组未参与模型和策略选择的独立随机初始条件；原始行为是数据集历史轨迹参考。
    conclusion: 三个最终系统的平均累计奖励均高于 BC。
    exports: [pdf, svg, png]

  - id: fig8_kl_ablation
    title: MB-PPO 行为 KL 约束消融
    decision: figure
    archetype: quantitative grid
    question: 行为 KL 是否限制 MB-PPO 偏离历史行为分布？
    sources:
      - outputs/metrics/strategy_ib_m1000_gru_mbppo.json
      - outputs/metrics/mbppo_ib_m1000_gru_with_kl_training.csv
      - outputs/metrics/mbppo_ib_m1000_gru_without_kl_training.csv
    controls: 固定世界模型、初始化、想象轨迹和 PPO 设置，仅改变行为 KL 约束。
    conclusion: 无 KL 约束时策略偏离显著扩大，并伴随严重性能退化。
    axis_note: KL 散度纵轴采用对数型尺度，并在接近零处保留线性区间。
    exports: [pdf, svg, png]

tables:
  - id: tab1_architectures
    title: 世界模型架构
    decision: table
    reason: 结构特点和精确参数量适合紧凑表格。
  - id: tab2_selected_world_models
    title: 各数据规模选定的世界模型
    decision: table
    reason: 选定轮次和各预测步数指标需要精确查阅。
  - id: tab3_depth_ablation
    title: Transformer 深度消融
    decision: table
    reason: 两种模型乘三个规模不足以支持趋势曲线。
  - id: tab4_strategy_matrix
    title: 策略累计奖励矩阵
    decision: table
    reason: 精确均值与标准差补充单次仿真散点图。
  - id: tab5_final_evaluation
    title: 最终 NeoRL 控制结果
    decision: table
    reason: 明确区分评价来源，并给出相对 BC 的精确变化。
  - id: tab_per_variable
    title: 变量级预测误差
    decision: appendix_table
    reason: 支持变量误差差异结论，但不打断正文主线。
  - id: tab_all_world_models
    title: 完整世界模型预测结果
    decision: appendix_table
    reason: 提供5种架构乘3个数据规模的15组完整数值，便于读者核查热图。
  - id: tab_data_scales
    title: 数据规模与训练设置
    decision: appendix_table
    reason: 明确轨迹数量、每轨迹转移数、可用状态转移数和正式训练轮数。

excluded_visuals:
  - 跨数据规模训练曲线
  - 选定轮次图
  - M10000 十轮训练曲线
  - 运行时间或延迟比较
