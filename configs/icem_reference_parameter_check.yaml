seed: 42

policies:
  official_bc_checkpoint: outputs/checkpoints/official_bc_ib_m1000.pt
  device: cuda
  world_models:
    M-1000:
      architecture: Transformer-2L
      checkpoint: outputs/checkpoints/world_model_ib_m1000_transformer2_fair_epoch_020.pt
    M-10000:
      architecture: Transformer-2L
      checkpoint: outputs/checkpoints/world_model_ib_m10000_transformer2_fair_epoch_004.pt

evaluation:
  role: development_reference_icem_minimal_parameter_check
  seeds: [42]
  episode_horizon: 1000

common:
  horizon: 10
  action_low: [-1.0, -1.0, -1.0]
  action_high: [1.0, 1.0, 1.0]
  elites: 10
  iterations: 3
  initial_std: 0.5
  min_std: 0.0
  momentum: 0.1
  population_decay: 1.25
  reuse_fraction: 0.3

variants:
  white_beta0_budget40:
    population: 40
    noise_beta: 0.0
  smooth_beta3_budget40:
    population: 40
    noise_beta: 3.0
  beta2_budget80:
    population: 80
    noise_beta: 2.0

source:
  repository: https://github.com/martius-lab/iCEM
  commit: 98c1c1fe2bfc94a87e4658b6c793f4e81bc30203
  colorednoise: colorednoise==2.2.0

outputs:
  metrics_json: outputs/metrics/icem_reference_parameter_check.json
  episodes_csv: outputs/metrics/icem_reference_parameter_check_episodes.csv
  timesteps_csv: outputs/metrics/icem_reference_parameter_check_timesteps.csv
