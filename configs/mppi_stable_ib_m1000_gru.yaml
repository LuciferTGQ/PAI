seed: 42

policies:
  official_bc_checkpoint: outputs/checkpoints/official_bc_ib_m1000.pt
  world_model_checkpoint: outputs/checkpoints/world_model_ib_m1000_gru_best.pt
  device: cuda

mppi:
  horizon: 10
  population: 128
  elites: 8
  iterations: 1
  initial_std: 0.35
  min_std: 0.05
  noise_std: [0.35, 0.35, 0.35]
  temperature: 30.0
  control_cost_weight: 0.01
  action_low: [-1.0, -1.0, -1.0]
  action_high: [1.0, 1.0, 1.0]

evaluation:
  role: development_mppi_stability_correction
  seeds: [42, 43, 44, 45, 46]
  held_out_seeds: [47, 48, 49, 50, 51]
  episode_horizon: 1000
  parent_metrics: outputs/metrics/strategy_ib_m1000_gru_planners.json
  diagnostic_basis: first-state ESS increased from 2.6 to 18.5 of 128

outputs:
  metrics_json: outputs/metrics/strategy_ib_m1000_gru_mppi_stable.json
  episode_csv: outputs/metrics/strategy_ib_m1000_gru_mppi_stable_episodes.csv
  comparison_figure: outputs/figures/strategy_ib_m1000_gru_mppi_stability.png
