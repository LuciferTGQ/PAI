seed: 42
policies:
  device: cuda
  world_models:
    M-1000:
      architecture: Transformer-2L
      checkpoint: outputs/checkpoints/world_model_ib_m1000_transformer2_fair_epoch_020.pt
    M-10000:
      architecture: Transformer-2L
      checkpoint: outputs/checkpoints/world_model_ib_m10000_transformer2_fair_epoch_004.pt
evaluation:
  role: development_reference_mppi_diagnostics
  seeds: [42]
  reserved_final_seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]
  episode_horizon: 1000
mppi:
  horizon: 10
  num_samples: 512
  noise_std: [0.15, 0.15, 0.15]
  temperature: 100.0
  action_low: [-1.0, -1.0, -1.0]
  action_high: [1.0, 1.0, 1.0]
source:
  repository: https://github.com/UM-ARM-Lab/pytorch_mppi
  tag: v0.9.1
  commit: e04a569cd4215e705f9013145c496fc59cb25ed6
  package: pytorch-mppi==0.9.1
outputs:
  metrics_json: outputs/metrics/mppi_reference_diagnostics.json
  episodes_csv: outputs/metrics/mppi_reference_diagnostics_episodes.csv
  timesteps_csv: outputs/metrics/mppi_reference_diagnostics_timesteps.csv
