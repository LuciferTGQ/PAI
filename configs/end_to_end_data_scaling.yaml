seed: 42

policies:
  official_bc_checkpoint: outputs/checkpoints/official_bc_ib_m1000.pt
  device: cuda

evaluation:
  role: held_out_end_to_end_world_model_data_scaling
  seeds: [47, 48, 49, 50, 51]
  episode_horizon: 1000
  architecture_locked_from_m1000: GRU
  strategy_locked_from_m1000: CEM_H10
  world_model_selection: outputs/metrics/world_model_data_scaling.json
