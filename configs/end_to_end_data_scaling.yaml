  action_high: [1.0, 1.0, 1.0]

outputs:
  metrics_json: outputs/metrics/strategy_end_to_end_data_scaling.json
  episode_csv: outputs/metrics/strategy_end_to_end_data_scaling_episodes.csv
  comparison_figure: outputs/figures/strategy_end_to_end_data_scaling.png
