seed: 42

source:
  repository: https://github.com/Polixir/OfflineRL
  commit: 807933a87f77529f17bd81ac64d717aad89f5cdf
  algorithm_file: offlinerl/algo/modelfree/bc.py
  config_file: offlinerl/config/algo/bc_config.py

data:
  train_path: data/raw/ib-medium-100-train.npz
  val_path: data/raw/ib-medium-10-val.npz
  obs_dim: 180
  action_dim: 3

model:
  actor_features: 256
  actor_layers: 2

training:
  device: cuda
  batch_size: 256
  steps_per_epoch: 1000
  max_epoch: 100
  actor_lr: 0.001
  log_interval: 10

outputs:
  checkpoint: outputs/checkpoints/official_bc_ib_m100.pt
  training_history_csv: outputs/metrics/official_bc_ib_m100_training.csv
  training_curve: outputs/figures/official_bc_ib_m100_training.png
