seed: 42

data:
  train_path: data/raw/ib-medium-1000-train.npz
  val_path: data/raw/ib-medium-100-val.npz
  history_len: 30
  frame_dim: 6
  action_dim: 3
  variable_names:
    - setpoint
    - velocity
    - gain
    - shift
    - fatigue
    - consumption

model:
  d_model: 64
  nhead: 4
  num_layers: 2
  dim_feedforward: 128
  dropout: 0.1

training:
  device: cuda
  batch_size: 512
  epochs: 100
  learning_rate: 0.0003
  weight_decay: 0.00001
  gradient_clip: 1.0
  num_workers: 0
  mixed_precision: true
  patience: 100

evaluation:
  batch_size: 2048
  horizons: [1, 5, 10, 20, 50]
  rollout_stride: 10
  selected_variables: [fatigue, consumption]
  one_step_plot_samples: 200

outputs:
  checkpoint: outputs/checkpoints/world_model_ib_m1000_100e_best.pt
  last_checkpoint: outputs/checkpoints/world_model_ib_m1000_100e_last.pt
  training_history_csv: outputs/metrics/world_model_ib_m1000_100e_training.csv
  training_curve: outputs/figures/world_model_ib_m1000_100e_training.png
  one_step_json: outputs/metrics/world_model_ib_m1000_100e_one_step.json
  one_step_csv: outputs/metrics/world_model_ib_m1000_100e_one_step.csv
  one_step_figure: outputs/figures/world_model_ib_m1000_100e_one_step.png
  multi_step_json: outputs/metrics/world_model_ib_m1000_100e_multi_step.json
  multi_step_csv: outputs/metrics/world_model_ib_m1000_100e_multi_step.csv
  horizon_figure: outputs/figures/world_model_ib_m1000_100e_horizon_error.png
  rollout_figure: outputs/figures/world_model_ib_m1000_100e_rollout.png
  ablation_json: outputs/metrics/world_model_ib_m1000_100e_ablation.json
