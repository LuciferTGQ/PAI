seed: 42
policies:
  device: cuda
  official_bc_checkpoint: outputs/checkpoints/official_bc_ib_m1000.pt
  world_models:
    MLP:
      checkpoint: outputs/checkpoints/world_model_ib_m1000_mlp_best.pt
      mbppo_config: configs/mbppo_cross_m1000_mlp.yaml
    GRU:
      checkpoint: outputs/checkpoints/world_model_ib_m1000_gru_best.pt
      mbppo_checkpoint: outputs/checkpoints/mbppo_ib_m1000_gru_with_kl_final.pt
    LSTM:
      checkpoint: outputs/checkpoints/world_model_ib_m1000_lstm_best.pt
      mbppo_config: configs/mbppo_cross_m1000_lstm.yaml
    Transformer-2L:
      checkpoint: outputs/checkpoints/world_model_ib_m1000_transformer2_fair_epoch_020.pt
      mbppo_checkpoint: outputs/checkpoints/mbppo_main_m1000_with_kl_final.pt
    Transformer-4L:
      checkpoint: outputs/checkpoints/world_model_ib_m1000_transformer4_epoch_040.pt
      mbppo_config: configs/mbppo_cross_m1000_transformer4.yaml
evaluation:
  role: development_world_model_to_control_cross
  seeds: [42, 43, 44, 45, 46]
  reserved_final_seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]
  episode_horizon: 1000
mppi:
  horizon: 10
  num_samples: 512
  noise_std: [0.15, 0.15, 0.15]
  temperature: 100.0
  action_low: [-1.0, -1.0, -1.0]
  action_high: [1.0, 1.0, 1.0]
reuse:
  main_metrics: outputs/metrics/main_system_matrix_development.json
  main_timesteps: outputs/metrics/main_system_matrix_development_timesteps.csv
outputs:
  metrics_json: outputs/metrics/world_model_control_cross_m1000.json
  episodes_csv: outputs/metrics/world_model_control_cross_m1000_episodes.csv
  timesteps_csv: outputs/metrics/world_model_control_cross_m1000_timesteps.csv
  summary_csv: outputs/metrics/world_model_control_cross_m1000_summary.csv
