seed: 42
policies:
  device: cuda
  official_bc_checkpoint: outputs/checkpoints/official_bc_ib_m1000.pt
  world_models:
    M-100:
      architecture: GRU
      checkpoint: outputs/checkpoints/world_model_ib_m100_gru_epoch_035.pt
      mbppo_config: configs/mbppo_main_m100.yaml
    M-1000:
      architecture: Transformer-2L
      checkpoint: outputs/checkpoints/world_model_ib_m1000_transformer2_fair_epoch_020.pt
      mbppo_config: configs/mbppo_main_m1000.yaml
    M-10000:
      architecture: Transformer-2L
      checkpoint: outputs/checkpoints/world_model_ib_m10000_transformer2_fair_epoch_004.pt
      mbppo_config: configs/mbppo_main_m10000.yaml
evaluation:
  role: development_main_system_matrix
  seeds: [42, 43, 44, 45, 46]
  reserved_final_seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]
  episode_horizon: 1000
cem:
  horizon: 10
  population: 64
  elites: 8
  iterations: 2
  initial_std: 0.35
  min_std: 0.05
  action_low: [-1.0, -1.0, -1.0]
  action_high: [1.0, 1.0, 1.0]
icem:
  horizon: 10
  population: 40
  elites: 10
  iterations: 3
  initial_std: 0.5
  min_std: 0.0
  momentum: 0.1
  population_decay: 1.25
  reuse_fraction: 0.3
  noise_beta: {M-100: 2.0, M-1000: 2.0, M-10000: 0.0}
  action_low: [-1.0, -1.0, -1.0]
  action_high: [1.0, 1.0, 1.0]
mppi:
  horizon: 10
  num_samples: 512
  noise_std: [0.15, 0.15, 0.15]
  temperature: 100.0
  action_low: [-1.0, -1.0, -1.0]
  action_high: [1.0, 1.0, 1.0]
reuse:
  planner_freeze_json: outputs/metrics/reference_planner_freeze.json
outputs:
  metrics_json: outputs/metrics/main_system_matrix_development.json
  episodes_csv: outputs/metrics/main_system_matrix_development_episodes.csv
  timesteps_csv: outputs/metrics/main_system_matrix_development_timesteps.csv
  summary_csv: outputs/metrics/main_system_matrix_development_summary.csv
